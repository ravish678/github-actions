name: Deploy to AWS EC2 Instance

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test
        continue-on-error: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          # EC2 hostname or public IP address stored securely as a GitHub secret
          host: ${{ secrets.AWS_EC2_HOST }}
          # SSH user for connecting to the EC2 instance
          username: ${{ secrets.AWS_EC2_USER }}
          # SSH private key stored as a GitHub secret for secure authentication
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: |
            # 1. Navigate to your app directory
            cd /home/my-app/github-actions
            
            # 2. Update code and install only production dependencies
            git pull origin main
            npm install --production
            
            # 3. Restart the existing process if it exists, or start a new one if it does not.
            #    This is safer than deleting first, because the old process can remain until
            #    the restart is attempted.
            #    '--update-env' tells PM2 to update the process environment variables
            #    from the current command, including PORT=80.
            
            sudo PORT=80 pm2 restart my-api --update-env || sudo PORT=80 pm2 start app.js --name my-api --update-env
            
            # 4. Save the PM2 list so it restarts if the EC2 reboots
            sudo pm2 save
